name: CI

on:
  push:
    branches:
      - retarget-compiler
  pull_request:

jobs:
  # Net10 bootstrap chain + IL fixed point + smoke (net10 plan 6.3).
  # Package restore needs no step/cache config: NemerleAll.nproj runs the
  # Restore target itself against the repo-scoped nuget.config (phase 5.3:
  # <clear/> + nuget.org only, no machine feeds).
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # This single invocation IS the full Stage1 -> Stage2 -> Stage3 chain
      # (Stage3 DependsOnTargets Stage2 -> Stage1; each stage is compiled by
      # the previous stage's ncc, seeded by the checked-in boot compiler)
      # plus Validate, which fc-compares the Stage2/Stage3 fixed point for
      # 5 assemblies in BOTH directions (prev->cur and cur->prev, since fc
      # with a wildcard only iterates its FIRST pattern -- 8.3c/R1-05); a
      # real FC difference fails the Exec (MSB3073) -> red.
      # -Rebuild forces the comparison to be produced fresh (standard green
      # gate, doc/NET10-BUILD-BASELINE.md). pefverify was retired in phase
      # 5.1, so this step is binding again and no longer needs the old
      # continue-on-error workaround.
      - name: Build Stage1 -> Stage2 -> Stage3 + Validate (IL fixed point)
        shell: pwsh
        run: |
          ./build.ps1 -Targets Stage3,Validate -Rebuild | Tee-Object -FilePath validate.log
          exit $LASTEXITCODE

      # Kept from phase 1.6 (simplified): belt and suspenders that the IL
      # comparison actually ran -- >= 10 "FC: no differences" lines expected
      # (5 assemblies x 2 fc directions, see Validate in NemerleAll.nproj),
      # no FC-reported difference (fc diffs surface as MSB3073 on the fc
      # command line in the log).
      - name: Gate on Validate IL fixed-point
        shell: pwsh
        run: |
          if (-not (Test-Path validate.log)) {
            Write-Host "::error::validate.log not found - the Validate step did not produce a log"
            exit 1
          }
          $log = Get-Content validate.log
          if ($log -match 'MSB3073.*"fc ' -or $log -match 'FC:.*(?<!no )differences') {
            Write-Host "::error::IL fixed-point broken: FC reported differences between stages"
            exit 1
          }
          $fc = @($log | Select-String -SimpleMatch 'FC: no differences').Count
          if ($fc -lt 10) {
            Write-Host "::error::only $fc 'FC: no differences' line(s) (>= 10 expected, 5 assemblies x 2 directions) - Validate did not reach the IL comparison"
            exit 1
          }
          Write-Host "IL fixed-point confirmed: $fc FC comparisons, no differences"
          exit 0

      # Net10 smoke (plan 6.3 acceptance, renamed to ncc.exe in plan 10.1): the
      # freshly built Stage3 ncc runs on the SDK installed above with NO
      # roll-forward trick; the old netcoreapp2.1 pin required
      # `dotnet --roll-forward LatestMajor`.
      - name: Smoke - ncc.exe -version without roll-forward
        shell: pwsh
        run: |
          if (Test-Path Env:DOTNET_ROLL_FORWARD) {
            Write-Host "::error::DOTNET_ROLL_FORWARD must not be set for this smoke step"
            exit 1
          }
          & bin/Debug/net-4.0/Stage3/ncc.exe -version
          exit $LASTEXITCODE

      # The zero-`-r` compile UX of phase 6.2b: a trivial .n compiles with
      # default framework references only - no explicit -r at all (ncc's
      # default output assembly name is out.exe).
      - name: Smoke - zero-r compile of a trivial .n
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'nemerle-zero-r-smoke'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Content -LiteralPath (Join-Path $dir 'smoke.n') `
            -Value 'using System; class M { static Main() : void { Console.WriteLine("zero-r smoke") } }'
          Push-Location $dir
          & "${{ github.workspace }}\bin\Debug\net-4.0\Stage3\ncc.exe" smoke.n
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0 -or -not (Test-Path (Join-Path $dir 'out.exe')) -and -not (Test-Path (Join-Path $dir 'out.dll'))) {
            Write-Host "::error::zero-r compile smoke failed (ncc exit $code, output assembly missing)"
            exit 1
          }
          Write-Host 'zero-r compile smoke passed'

  # Compiler regression suite on the Core host.
  tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # CompilerTests must run in the same msbuild session as Stage1, hence
      # the combined target list "Stage1,CompilerTests" (build.ps1 passes it
      # to MSBuild as ONE argument). NKnownFailures is read by
      # NemerleAll.nproj (MSBuild exposes env vars as properties) and handed
      # to the harness as -known-failures: ONLY the listed ids stop affecting
      # the exit code, any other failure keeps this job red. 6.4 resolved all
      # 8 entries this allowlist once carried (7 BEGIN-OUTPUT output drifts +
      # the Issue-git-0297 fixture), so testsuite/ci-known-failures-64.txt is
      # comments-only and loads zero ids. The file and the NKnownFailures
      # line are kept as empty-by-default insurance -- a working place to
      # park a temporary allowlist (one test id per line) if CI ever needs one.
      - name: CompilerTests (Stage1 + suite; known-failures allowlist empty by default)
        shell: pwsh
        run: |
          $env:NKnownFailures = 'ci-known-failures-64.txt'
          ./build.ps1 -Targets Stage1,CompilerTests
